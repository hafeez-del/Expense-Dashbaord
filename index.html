<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("exp-theme")||"light"}catch(e){}</script>
<title>Expense Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
/* layout: slim sidebar (2 pages), filter card, compact category cards with sparklines, two equal bar charts */
:root{--bg:#f3f7f4;--card:#fff;--tx:#14211a;--mut:#6b7d73;--bd:#e3ebe6;--pr:#1f9d55;--pr2:#6cc491;--soft:#e6f5ec;--softer:#f1faf4;--ok:#1ea56b;--bad:#e5484d;--or:#f0642f;--vi:#8b5cf6;--bl:#3b82f6;--yl:#e5a00d;--pk:#d946a8;--tl:#14b8a6;--sh:0 1px 2px rgba(20,60,40,.04),0 8px 24px rgba(20,60,40,.06)}
[data-theme=dark]{--bg:#0b120e;--card:#111b15;--tx:#e8f2ec;--mut:#93a89b;--bd:#213027;--pr:#35c46f;--pr2:#1c7a43;--soft:#16281d;--softer:#0f1f16;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}[hidden]{display:none!important}.mut,small{color:var(--mut)}.grow{flex:1}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}

/* dropdowns */
.ddwrap{position:relative}
.ddbtn{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;color:var(--tx);min-width:140px;transition:.2s;font-size:13px;cursor:pointer}
.ddbtn:hover{border-color:var(--pr);color:var(--pr)}
.ddbtn .k{font-size:10px;text-transform:uppercase;color:var(--mut);letter-spacing:.08em;font-weight:600}
.ddbtn .v{font-weight:600;color:var(--tx);margin-left:auto}
.ddbtn .ca{color:var(--mut);font-size:10px}
.ddpanel{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:8px;min-width:260px;z-index:50;animation:ip .18s}
.ddpanel input.search{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);outline:0;margin-bottom:6px;font-size:13px}
.ddpanel input.search:focus{border-color:var(--pr)}
.ddlist{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ddopt{display:flex;align-items:center;gap:10px;padding:9px 10px;background:none;border:0;border-radius:8px;color:var(--tx);text-align:left;cursor:pointer;transition:.12s;font-size:13px;width:100%}
.ddopt:hover,.ddopt.hi{background:var(--soft)}
.ddopt .chk{width:16px;height:16px;flex:none;border-radius:5px;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:10px;color:transparent;transition:.15s}
.ddopt[aria-selected=true] .chk{background:var(--pr);border-color:var(--pr);color:#fff}
.ddopt .sid{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.ddfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px 2px;margin-top:4px;border-top:1px solid var(--bd);font-size:11px;color:var(--mut)}
.ddfoot button{padding:5px 12px;border-radius:8px;background:var(--pr);color:#fff;font-weight:600;font-size:12px;border:0;cursor:pointer}

/* icon buttons */
.ibtn{width:38px;height:38px;border:1px solid var(--bd);background:var(--card);border-radius:10px;color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.2s;font-size:16px}
.ibtn:hover{border-color:var(--pr);color:var(--pr)}
.ibtn.spin{animation:sp .6s linear}
@keyframes sp{to{transform:rotate(360deg)}}

/* grid */
.grid{display:grid;gap:16px;margin-bottom:0}
#viewroot{display:grid;gap:16px;align-content:start}#viewroot>*{min-width:0}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--sh)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.qc{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;transition:.2s;color:var(--tx)}
.qc:hover{border-color:var(--pr);color:var(--pr)}.qc.on{background:var(--pr);border-color:var(--pr);color:#fff}
.g2{grid-template-columns:2fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:1fr}}
@media(max-width:720px){.g6,.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}

/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);min-width:0;animation:ip .35s ease-out}
.card h3{font-size:15px;font-weight:700;letter-spacing:.01em}
.card .sub{font-size:12px;color:var(--mut);margin-top:2px;margin-bottom:14px}
.card.kpi .t{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px;font-weight:600}
.card.kpi .ic{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--pr);display:grid;place-items:center;font-size:14px}
.card.kpi .v{font-size:26px;font-weight:800;margin:10px 0 6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card.kpi .f{font-size:12px;color:var(--mut)}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}

/* chart canvas */
.ch{position:relative;height:280px}
.ch.s{height:220px}
.ch.m{height:320px}
.ch.l{height:400px}
.ch.xl{height:480px}
.ch canvas{max-width:100%}

/* tables */
.tw{overflow:auto;border:1px solid var(--bd);border-radius:12px}
.tw.tall{max-height:620px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:var(--softer);text-align:left;padding:11px 12px;font-weight:700;cursor:pointer;user-select:none;z-index:3;border-bottom:1px solid var(--bd);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th:first-child{position:sticky;left:0;z-index:4;min-width:200px}
td{padding:10px 12px;border-top:1px solid var(--bd)}
td:first-child{position:sticky;left:0;background:var(--card);z-index:2;font-weight:600;min-width:200px}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--softer)}
tbody tr:hover td:first-child{background:var(--softer)}
tbody tr.sec td{background:var(--soft)!important;color:var(--pr);font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
tbody tr.sec td:first-child{background:var(--soft)!important;color:var(--pr)}
tbody tr.sub td{font-weight:700;background:var(--softer)!important}
tbody tr.sub td:first-child{background:var(--softer)!important}
tfoot td{font-weight:700;background:var(--softer);position:sticky;bottom:0}
.swatch{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:middle}

/* badges */
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.b-ok{background:#1ea56b22;color:var(--ok)}.b-bad{background:#e5484d22;color:var(--bad)}
.b-mid{background:#f0642f22;color:var(--or)}.b-na{background:var(--soft);color:var(--mut)}

/* tab strip */
.tabstrip{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
.tab{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--tx);background:var(--card);border:1px solid var(--bd);cursor:pointer;transition:.18s;white-space:nowrap}
.tab:hover{border-color:var(--pr);color:var(--pr)}
.tab[aria-selected=true]{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
.tab .amt{font-size:11px;opacity:.85;font-weight:500;font-variant-numeric:tabular-nums}

/* section hero */
.hd{display:flex;justify-content:space-between;align-items:center;margin:6px 0 0;flex-wrap:wrap;gap:12px}
.hd h2{font-size:17px;font-weight:700}
.hd .sub{font-size:12px;color:var(--mut);margin-top:2px}

/* search */
.srch{position:relative;display:flex;align-items:center;gap:8px}
.srch input{padding:9px 12px 9px 34px;border:1px solid var(--bd);border-radius:10px;background:var(--card);outline:0;font-size:13px;color:var(--tx);min-width:220px}
.srch input:focus{border-color:var(--pr)}
.srch .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}

/* small */
.mini{font-size:11px;color:var(--mut)}
.chip{padding:4px 10px;border-radius:14px;background:var(--soft);color:var(--pr);font-weight:600;font-size:11px}

.view{animation:fade .35s}@keyframes fade{from{opacity:0}}

/* modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:200;animation:fade .2s;padding:20px;backdrop-filter:blur(2px)}
.mbox{background:var(--card);border-radius:18px;padding:26px;width:min(1120px,96vw);max-height:92vh;overflow:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:ip .3s ease-out}
.mbox h2{font-size:22px;font-weight:800}.mbox .msub{color:var(--mut);font-size:13px;margin:2px 0 18px}
.mx{position:absolute;right:16px;top:14px;font-size:20px;color:var(--mut);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.mx:hover{background:var(--soft);color:var(--tx)}
.mbody{display:grid;gap:16px}
.mbox .card{box-shadow:none;background:var(--card)}
.share{display:inline-block;height:6px;border-radius:4px;background:var(--pr);vertical-align:middle;margin-left:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--bg:#d9e3dc;--shell:#f3f7f4;--card:#fff;--tx:#12261f;--mut:#5b6f65;--bd:#e1e9e3;--pr:#1d4a3a;--pr2:#2f7d5f;--soft:#e4f3c9;--softer:#f4f9ea;--onpr:#fff;--hi:#c6f06a;--bar:#2f7d5f;--bar2:#1d4a3a;--oth:#b9c8bf;--spk:#1d4a3a;--bl:#3b82f6;--sp1:#0d9488;--sp2:#5fc21f;--sf1:#3b82f6;--sf2:#22d3ee;--rail1:#15392d;--rail2:#0e2820;--sh:0 1px 2px rgba(18,50,38,.04),0 8px 24px rgba(18,50,38,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f0b;--shell:#0d1b15;--card:#12241d;--tx:#e9f3ee;--mut:#8fa69b;--bd:#1f372d;--pr:#c6f06a;--pr2:#8fcf4e;--soft:#1c3a2c;--softer:#0f1f18;--onpr:#10231b;--bar:#4cc38a;--bar2:#2b8a63;--oth:#3a5247;--spk:#c6f06a;--sp1:#2dd4bf;--sp2:#c6f06a;--sf1:#60a5fa;--sf2:#67e8f9;--rail1:#143a2d;--rail2:#0c2a20;--sh:0 10px 28px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070f0b;--shell:#0d1b15;--card:#12241d;--tx:#e9f3ee;--mut:#8fa69b;--bd:#1f372d;--pr:#c6f06a;--pr2:#8fcf4e;--soft:#1c3a2c;--softer:#0f1f18;--onpr:#10231b;--bar:#4cc38a;--bar2:#2b8a63;--oth:#3a5247;--spk:#c6f06a;--sp1:#2dd4bf;--sp2:#c6f06a;--sf1:#60a5fa;--sf2:#67e8f9;--rail1:#143a2d;--rail2:#0c2a20;--sh:0 10px 28px rgba(0,0,0,.4);color-scheme:dark}

/* shell: floating rail + rounded workspace */
#app{display:flex;gap:22px;margin:16px;padding:14px;border-radius:30px;background:var(--shell);box-shadow:var(--sh);min-height:calc(100vh - 32px)}
#rail{width:68px;flex:none;border-radius:24px;background:linear-gradient(180deg,var(--rail1),var(--rail2));display:flex;flex-direction:column;align-items:center;padding:14px 0 14px;gap:8px;position:sticky;top:30px;height:calc(100vh - 60px);z-index:20}
.rmark{width:42px;height:42px;border-radius:14px;background:var(--hi);color:#12332a;display:grid;place-items:center;margin-bottom:22px}
#nav{display:flex;flex-direction:column;gap:10px;align-items:center}
.rbtn{width:44px;height:44px;border-radius:14px;color:#a9c7b8;display:grid;place-items:center;position:relative;border:1.5px solid transparent;transition:background .2s,color .2s,border-color .2s;cursor:pointer}
.rbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.rbtn.on{color:var(--hi);border-color:var(--hi);background:rgba(198,240,106,.1)}
#theme{margin-top:auto}
.rbtn::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%) translateX(-4px);background:#12261f;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.rbtn:hover::after,.rbtn:focus-visible::after{opacity:1;transform:translateY(-50%)}
main{flex:1;min-width:0;padding:4px 10px 18px 0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 0 12px}
.ttl{display:flex;flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.top .sub{font-size:12px;color:var(--mut);margin:0}
.topr{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upd{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);white-space:nowrap;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:0 12px;height:32px}
.upd i{width:7px;height:7px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 3px rgba(198,240,106,.4)}
.srch{position:relative;display:flex;align-items:center}
.srch input{height:32px;width:250px;padding:0 14px 0 34px;border:1px solid var(--bd);border-radius:18px;background:var(--card);outline:0;font-size:12px;color:var(--tx)}
.srch input:focus{border-color:var(--pr)}
.srch .ico{position:absolute;left:11px;color:var(--mut);display:grid;place-items:center;pointer-events:none}

/* filters */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:6px 8px;border-radius:14px;background:var(--card);border:1px solid var(--bd);box-shadow:none}
.ddbtn{height:30px;border-radius:16px;padding:0 11px;min-width:0;font-size:12px;gap:7px}
.ddbtn .k{font-size:9.5px}
.chips{margin-left:auto;display:flex;gap:5px}
.qc{height:26px;padding:0 12px;font-size:11.5px;border-radius:14px}
.qc.on{background:var(--pr);border-color:var(--pr);color:var(--onpr);font-weight:600}

/* layout */
#viewroot{display:grid;gap:18px;align-content:start}#viewroot>*{min-width:0}
.g2e{grid-template-columns:1fr 1fr}@media(max-width:1000px){.g2e{grid-template-columns:1fr}}

/* main cards */
.stats{display:grid;grid-template-columns:1fr 1fr 1.15fr 1.6fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 14px 12px;box-shadow:var(--sh);animation:ip .45s ease-out backwards;min-width:0;display:flex;flex-direction:column;gap:6px}
.stat.click{cursor:pointer;transition:border-color .2s,transform .2s}.stat.click:hover{border-color:var(--pr2);transform:translateY(-2px)}
.st-h{display:flex;align-items:center;gap:8px;min-width:0}
.st-i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.t-or{background:#f0642f1f;color:#e0561f}.t-lime{background:var(--soft);color:var(--pr)}.t-bl{background:#3b82f622;color:#2f6fe0}.t-ok{background:#1ea56b22;color:#138a57}.t-bad{background:#e5484d22;color:#d23a3f}
[data-theme="dark"] .t-or{color:#ff8a5c}[data-theme="dark"] .t-bl{color:#7fb0ff}[data-theme="dark"] .t-ok{color:#5fe0a6}
.st-l{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.st-b{margin-left:auto;font-size:10px;font-weight:600;color:var(--mut);background:var(--softer);border-radius:12px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.st-v{font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.st-s{font-size:11.5px;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-3px}
.t6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:62px;align-items:end;margin-top:auto}
.t6c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;min-width:0}
.t6v{font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tx);white-space:nowrap}
.t6c i{display:block;width:70%;max-width:26px;min-height:2px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--bar),var(--bar2));transform-origin:bottom;animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
.t6c i.hi{background:var(--hi)}
.t6c em{font-style:normal;font-size:9.5px;color:var(--mut);font-weight:500}
@keyframes rise{from{transform:scaleY(0)}}
@media(max-width:1100px){.stats{grid-template-columns:1fr 1fr}.stat.trend6{grid-column:span 2}}

/* section heads + category cards */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px}
.sh h2{font-size:17px;font-weight:700}.sh span{font-size:12.5px;color:var(--mut)}
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
.ccard{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);cursor:pointer;min-width:0;
 background:radial-gradient(110% 120% at 100% 0%,color-mix(in srgb,var(--sp2) 12%,transparent),transparent 60%),var(--card);box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s;animation:ip .4s ease-out backwards}
.ccard.fund{background:radial-gradient(110% 120% at 100% 0%,color-mix(in srgb,var(--sf2) 14%,transparent),transparent 60%),var(--card)}
.ccard:hover{transform:translateY(-2px);border-color:var(--pr2);box-shadow:0 10px 22px rgba(18,50,38,.12)}
.cl,.cr{min-width:0}
.c-name{font-size:11.5px;font-weight:500;color:var(--mut);line-height:1.3;overflow-wrap:anywhere}
.c-val{font-size:15px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:3px}
.spw{position:relative;margin:2px 5px 0 0;height:30px}
.spk{display:block;width:100%;height:30px;overflow:visible}
.dot{position:absolute;right:0;width:7px;height:7px;border-radius:50%;transform:translate(50%,-50%);box-shadow:0 0 0 2px var(--card)}
.ccard .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s ease-out .2s forwards}
.se{display:flex;justify-content:space-between;gap:6px;margin-top:3px;font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.se em{font-style:normal;font-weight:500;color:var(--mut);margin-right:3px}
@keyframes draw{to{stroke-dashoffset:0}}

/* chart cards */
.card{border-radius:18px}
.chh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.chh h3{font-size:15px;font-weight:700}.chh .sub{font-size:12px;color:var(--mut);margin-top:2px}
.selw{position:relative;display:inline-flex;align-items:center;flex:none}.selw .i{position:absolute;right:12px;pointer-events:none;color:var(--mut)}

/* keep the grid full: stretch the cards of an incomplete last row so no gap is left */
function fitGrid(grid){
  if(!grid||!grid.isConnected)return;
  const kids=[].slice.call(grid.children);
  kids.forEach(k=>{k.style.gridColumn='';});
  const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length,r=kids.length%cols;
  if(!r||kids.length<2)return;
  const last=kids.slice(-r),base=Math.floor(cols/r),extra=cols%r;
  last.forEach((k,i)=>{k.style.gridColumn='span '+(base+(i<extra?1:0));});
}

    return h;
  };
  let body=outs.slice().sort((a,b)=>sum(R(gSeries(b)))-sum(R(gSeries(a)))).map(rowsFor).join('');
  if(!outs.length)body='<tr><td colspan="'+(labs.length+3)+'" class="mut">No categories match.</td></tr>';
  const sp=R(totSeries(outG())),fu=R(totSeries(G.filter(g=>g.kind==='in'&&gOk(g)))),nt=fu.map((v,i)=>v-sp[i]);
  let foot='<tr class="sub"><td>Total expense</td>'+sp.map(cell).join('')+'<td class="n"><b>'+money(sum(sp))+'</b></td><td class="n">100%</td></tr>';
  if(ins.length){foot+='<tr class="sec"><td colspan="'+(labs.length+3)+'">Funding &amp; inflows</td></tr>'+ins.map(rowsFor).join('');
    foot+='<tr class="sub"><td>Net (funding − expense)</td>'+nt.map(v=>'<td class="n" style="color:'+(v<0?'var(--bad)':'var(--ok)')+'">'+money(v)+'</td>').join('')+'<td class="n"><b style="color:'+(sum(nt)<0?'var(--bad)':'var(--ok)')+'">'+money(sum(nt))+'</b></td><td class="n"></td></tr>';}
  const w=document.createElement('div');w.className='tw tall';
  w.innerHTML='<table class="bt"><thead><tr><th>Category</th>'+labs.map(m=>'<th class="n">'+m+'</th>').join('')+'<th class="n">Total</th><th class="n">Share</th></tr></thead><tbody>'+body+foot+'</tbody></table>';
  c.body.appendChild(w);
  w.querySelectorAll('tr.grp').forEach(tr=>{const tg=()=>{const n=tr.dataset.g;state.open[n]=!state.open[n];render({keep:true});};tr.tabIndex=0;tr.setAttribute('aria-expanded',tr.querySelector('.car').classList.contains('open'));tr.addEventListener('click',tg);tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg();}});});
  tb.querySelector('#xa').addEventListener('click',()=>{G.forEach(g=>state.open[g.name]=true);render({keep:true});});
  tb.querySelector('#ca').addEventListener('click',()=>{state.open={};render({keep:true});});
}

/* shell */
const VIEWS=[{id:'dash',ic:'dash',t:'Dashboard',sub:'Expenses at a glance'},{id:'table',ic:'table',t:'Table view',sub:'Every category and item, month by month'}];
function renderNav(){
  const nav=$('#nav');nav.innerHTML='';
  VIEWS.forEach(v=>{const a=document.createElement('button');a.type='button';a.className='rbtn'+(v.id===state.view?' on':'');a.dataset.tip=v.t;a.setAttribute('aria-label',v.t);
    if(v.id===state.view)a.setAttribute('aria-current','page');a.innerHTML=ic(v.ic,20);
    a.addEventListener('click',()=>{state.view=v.id;renderNav();render({top:true});});nav.appendChild(a);});
}
function render(o){
  o=o||{};const v=VIEWS.find(x=>x.id===state.view);
  $('#ptitle').textContent=v.t;$('#psub').textContent=v.sub+' · '+periodText();
  const root=$('#viewroot'),y=window.scrollY,h=root.offsetHeight;
  if(o.keep)root.style.minHeight=h+'px';
  killCharts();TREND=null;root.innerHTML='';
  (state.view==='dash'?viewDash:viewTable)(root);
  quickChips();
  if(o.top)window.scrollTo(0,0);
  else if(o.keep){window.scrollTo(0,y);requestAnimationFrame(()=>{root.style.minHeight='';window.scrollTo(0,y);});}
}
$('#gq').addEventListener('input',e=>{state.q=e.target.value.trim();render({keep:true});});
$('#theme').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';LS.set('exp-theme',state.theme);document.documentElement.setAttribute('data-theme',state.theme);setThemeIcon();render({keep:true});});
buildFilters();renderNav();render({top:true});
})();
</script>
